<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="迷雾森林火把走法：跟随火把亮起的方向前进">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274d23"/>
      <stop offset="1" stop-color="#16331a"/>
    </linearGradient>
  </defs>
  <rect width="760" height="300" fill="url(#fog)"/>

  <!-- 迷雾颗粒 -->
  <g fill="#cfe0c8" opacity="0.12">
    <circle cx="120" cy="80" r="40"/><circle cx="640" cy="220" r="50"/>
    <circle cx="300" cy="40" r="30"/><circle cx="520" cy="260" r="36"/>
  </g>

  <!-- 起点 -->
  <g transform="translate(380,270)">
    <rect x="-46" y="-14" width="92" height="28" rx="6" fill="#3a2f1a" stroke="#cbaa5a" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f7f3e6" font-weight="700">起点 · 入口</text>
  </g>

  <!-- 主路径（蜿蜒，跟随火把方向） -->
  <path d="M380 256 C380 230 300 220 300 190 C300 160 460 150 460 120 C460 92 360 84 360 56"
        fill="none" stroke="#cbaa5a" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- 火把 + 方向箭头 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <!-- 火把1 -->
    <g transform="translate(380,236)">
      <rect x="-3" y="-6" width="6" height="20" fill="#7a5a2e"/>
      <ellipse cx="0" cy="-10" rx="7" ry="10" fill="#ffb347"/>
      <ellipse cx="0" cy="-12" rx="3.5" ry="6" fill="#fff1a8"/>
      <text x="22" y="2" font-size="13" fill="#ffe6a8" font-weight="700">↑ 直行</text>
    </g>
    <!-- 火把2 -->
    <g transform="translate(300,190)">
      <rect x="-3" y="-6" width="6" height="20" fill="#7a5a2e"/>
      <ellipse cx="0" cy="-10" rx="7" ry="10" fill="#ffb347"/>
      <ellipse cx="0" cy="-12" rx="3.5" ry="6" fill="#fff1a8"/>
      <text x="-118" y="2" font-size="13" fill="#ffe6a8" font-weight="700">→ 向右</text>
    </g>
    <!-- 火把3 -->
    <g transform="translate(460,120)">
      <rect x="-3" y="-6" width="6" height="20" fill="#7a5a2e"/>
      <ellipse cx="0" cy="-10" rx="7" ry="10" fill="#ffb347"/>
      <ellipse cx="0" cy="-12" rx="3.5" ry="6" fill="#fff1a8"/>
      <text x="20" y="2" font-size="13" fill="#ffe6a8" font-weight="700">← 向左</text>
    </g>
    <!-- 火把4 -->
    <g transform="translate(360,56)">
      <rect x="-3" y="-6" width="6" height="20" fill="#7a5a2e"/>
      <ellipse cx="0" cy="-10" rx="7" ry="10" fill="#ffb347"/>
      <ellipse cx="0" cy="-12" rx="3.5" ry="6" fill="#fff1a8"/>
    </g>
  </g>

  <!-- 终点：科洛格森林 -->
  <g transform="translate(360,28)">
    <circle r="16" fill="#2d5a27" stroke="#cbaa5a" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-size="15" fill="#cbaa5a" font-weight="700">⚔</text>
    <text x="0" y="40" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#f7f3e6" font-weight="700">科洛格森林</text>
  </g>

  <!-- 说明 -->
  <text x="40" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#e9dcb8">提示：迷雾中紧盯地面火把亮起的方向，逐段前进；偏离会被送回入口。</text>
</svg>
