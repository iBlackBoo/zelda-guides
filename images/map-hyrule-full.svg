<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" aria-label="海拉尔全要素地图：神庙、呀哈哈、四神兽与商人位置">
  <defs>
    <linearGradient id="landF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece0bd"/>
      <stop offset="1" stop-color="#d6c496"/>
    </linearGradient>
    <radialGradient id="seaF" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#cfe3ec"/>
      <stop offset="1" stop-color="#a6cad6"/>
    </radialGradient>
  </defs>
  <rect width="440" height="560" fill="url(#seaF)"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="440" height="64" fill="#2d5a27"/>
  <text x="220" y="30" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#f7f3e6">海拉尔全要素地图</text>
  <text x="220" y="50" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#cbb98a">Hyrule Full Map · A1 HD · 神庙/呀哈哈/神兽/商人</text>

  <!-- 陆地 -->
  <path d="M70 150 C150 110 300 110 380 150 C422 200 422 300 380 360 C350 432 250 452 160 442 C90 432 60 360 60 290 C58 230 50 180 70 150 Z"
        fill="url(#landF)" stroke="#b29a64" stroke-width="2" transform="translate(0,40)"/>

  <!-- 神庙（橙点） -->
  <g fill="#e07b2c">
    <circle cx="150" cy="210" r="3"/><circle cx="200" cy="200" r="3"/><circle cx="250" cy="215" r="3"/><circle cx="300" cy="205" r="3"/>
    <circle cx="170" cy="250" r="3"/><circle cx="230" cy="255" r="3"/><circle cx="290" cy="250" r="3"/><circle cx="340" cy="240" r="3"/>
    <circle cx="140" cy="290" r="3"/><circle cx="210" cy="300" r="3"/><circle cx="270" cy="295" r="3"/><circle cx="330" cy="290" r="3"/>
    <circle cx="160" cy="340" r="3"/><circle cx="230" cy="350" r="3"/><circle cx="290" cy="345" r="3"/><circle cx="340" cy="360" r="3"/>
    <circle cx="190" cy="390" r="3"/><circle cx="260" cy="400" r="3"/><circle cx="320" cy="395" r="3"/>
  </g>
  <!-- 呀哈哈（绿点） -->
  <g fill="#5aa84b">
    <circle cx="130" cy="230" r="2.5"/><circle cx="270" cy="230" r="2.5"/><circle cx="350" cy="220" r="2.5"/><circle cx="120" cy="270" r="2.5"/>
    <circle cx="310" cy="270" r="2.5"/><circle cx="180" cy="320" r="2.5"/><circle cx="250" cy="330" r="2.5"/><circle cx="360" cy="320" r="2.5"/>
    <circle cx="150" cy="370" r="2.5"/><circle cx="300" cy="375" r="2.5"/><circle cx="220" cy="420" r="2.5"/><circle cx="280" cy="430" r="2.5"/>
  </g>
  <!-- 商人（小袋） -->
  <g fill="#8a6a3a">
    <circle cx="210" cy="270" r="4"/><circle cx="320" cy="300" r="4"/><circle cx="160" cy="350" r="4"/><circle cx="270" cy="360" r="4"/><circle cx="230" cy="430" r="4"/>
  </g>

  <!-- 四神兽 -->
  <g font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <rect x="100" y="218" width="22" height="22" rx="4" fill="#3a78b5" transform="translate(0,40)"/><text x="111" y="234" fill="#fff" transform="translate(0,40)">M</text>
    <rect x="338" y="230" width="22" height="22" rx="4" fill="#caa23a" transform="translate(0,40)"/><text x="349" y="246" fill="#fff" transform="translate(0,40)">N</text>
    <rect x="338" y="280" width="22" height="22" rx="4" fill="#2bb6a8" transform="translate(0,40)"/><text x="349" y="296" fill="#fff" transform="translate(0,40)">R</text>
    <rect x="108" y="370" width="22" height="22" rx="4" fill="#c0392b" transform="translate(0,40)"/><text x="119" y="386" fill="#fff" transform="translate(0,40)">B</text>
  </g>

  <!-- 区域标注 -->
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#5b4a25" transform="translate(0,40)">
    <text x="220" y="180" text-anchor="middle" font-weight="700">科洛格森林</text>
    <text x="350" y="200">死亡山</text>
    <text x="100" y="195">海布拉</text>
    <text x="100" y="420">格鲁德</text>
    <text x="350" y="320">卓拉</text>
    <text x="220" y="400">卡卡利科</text>
    <text x="220" y="455">海拉鲁湖</text>
  </g>

  <!-- 指南针 -->
  <g transform="translate(400,500)">
    <circle r="18" fill="#f7f3e6" stroke="#b29a64" stroke-width="2"/>
    <polygon points="0,-13 5,3 0,-1 -5,3" fill="#c0392b"/>
    <text x="0" y="-20" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#5b4a25">N</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(20,478)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#5b4a25">
    <rect x="0" y="0" width="200" height="66" rx="6" fill="#f7f3e6" stroke="#b29a64"/>
    <circle cx="14" cy="16" r="4" fill="#e07b2c"/><text x="26" y="20">神庙 Shrine</text>
    <circle cx="14" cy="34" r="3.5" fill="#5aa84b"/><text x="26" y="38">呀哈哈 Korok</text>
    <circle cx="14" cy="52" r="4" fill="#8a6a3a"/><text x="26" y="56">商人 Merchant</text>
    <rect x="120" y="10" width="14" height="14" rx="3" fill="#c0392b"/><text x="140" y="20">四神兽</text>
    <text x="120" y="40" font-size="9">M梅德/ N娜波/</text>
    <text x="120" y="54" font-size="9">R露塔/ B鲁达</text>
  </g>
</svg>
