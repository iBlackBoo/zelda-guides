<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="攻略缩略图：如何拔起大师之剑">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#356b2d"/>
      <stop offset="1" stop-color="#1c3a18"/>
    </linearGradient>
    <linearGradient id="bl1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fcff"/>
      <stop offset="1" stop-color="#b9e3f3"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg1)"/>
  <ellipse cx="240" cy="120" rx="120" ry="110" fill="#9fe6ff" opacity="0.12"/>
  <!-- 剑 -->
  <g transform="translate(240,110)">
    <rect x="-9" y="-70" width="18" height="120" rx="4" fill="url(#bl1)" stroke="#8fc7da"/>
    <polygon points="0,-92 -11,-68 11,-68" fill="#eaf7ff"/>
    <rect x="-30" y="48" width="60" height="12" rx="4" fill="#cbaa5a"/>
    <rect x="-7" y="60" width="14" height="20" fill="#8a6f3c"/>
    <circle cx="0" cy="84" r="6" fill="#cbaa5a"/>
  </g>
  <rect x="0" y="206" width="480" height="64" fill="#102318" opacity="0.85"/>
  <text x="240" y="234" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#f7f3e6">如何拔起大师之剑</text>
  <text x="240" y="256" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#cbb98a">How to Pull the Master Sword</text>
</svg>
